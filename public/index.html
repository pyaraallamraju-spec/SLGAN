'+cats.map(function(c){return '<button class="chip '+(category===c?'active':'')+'" onclick="category=\''+c+'\';render()">'+c+'</button>'}).join("")+'</div>'+cards(list)}
function openProduct(id){chosen=products.find(function(p){return p.id===id});page="Product";renderNav();render()}function detail(p){return '<button class="secondary" onclick="go(\'Categories\')">← Back to products</button><div class="panel detail" style="margin-top:14px"><div>'+(image(p)?'<img src="'+esc(image(p))+'" alt="'+esc(name(p))+'">':'<div class="product-img" style="height:280px">🌿</div>')+'</div><div><span class="badge">'+esc(cat(p))+'</span><h1 class="title" style="margin-top:12px">'+esc(name(p))+'</h1><p class="muted">'+esc(units(p))+'</p><div class="price" style="font-size:28px">'+money(price(p))+'</div><p class="muted">'+(inStock(p)?"In stock":"Out of stock")+'</p><button '+(inStock(p)?'':'disabled')+' onclick="addCart(\''+esc(p.id)+'\')">Add to Cart</button>'+section("Description",get(p,["product_description","description"]))+section("Usage",get(p,["product_usage","usage"]))+section("Major ingredients",get(p,["product_ingredients","ingredients","product_major_ingredients"]))+'<p class="foot">Use according to the product label and qualified healthcare professional advice.</p></div></div>'}function section(title,txt){return txt?'<details class="accordion"><summary>'+title+'</summary><p>'+esc(txt)+'</p></details>':''}
function addCart(id){var p=products.find(function(p){return p.id===id});if(!p||!inStock(p))return;cart[id]=(cart[id]||0)+1;saveCart();renderNav();if(page==="Cart")render()}function qty(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];saveCart();render()}

function checkout(){if(!user){alert("Please sign in before placing an order.");go("Profile");return}var main=$("main");main.innerHTML='<h1 class="title">Checkout</h1><p class="sub">Review your details and submit your order request.</p><form class="panel" id="checkoutForm"><div class="form-grid"><div><label>Customer name *</label><input id="coName" required value="'+esc((profile.firstName||"")+" "+(profile.lastName||""))+'"></div><div><label>Email *</label><input id="coEmail" type="email" required value="'+esc(user.email||"")+'"></div><div><label>Phone number</label><input id="coPhone" value="'+esc(profile.mobileNumber||"")+'"></div><div class="span2"><label>Full delivery address *</label><textarea id="coAddress" required>'+esc(profile.address||"")+'</textarea></div></div><div class="notice">No online payment. Delivery charges and final details will be confirmed by the shop.</div><div class="actions"><button id="placeBtn">Place order</button><button type="button" class="secondary" onclick="go(\'Cart\')">Back to cart</button></div></form>'; $("checkoutForm").onsubmit=placeOrder}
async function placeOrder(e){e.preventDefault();var btn=$("placeBtn");btn.disabled=true;try{var items=Object.keys(cart).map(function(id){var p=products.find(function(p){return p.id===id});return p?{productId:id,name:name(p),category:cat(p),quantity:cart[id],unitPrice:price(p),lineTotal:price(p)*cart[id]}:null}).filter(Boolean);if(!items.length)throw Error("Your cart is empty.");var subtotal=items.reduce(function(s,i){return s+i.lineTotal},0),ref=db.collection("orders").doc(),orderId="SLGAN-"+ref.id.slice(0,10).toUpperCase();await ref.set({orderId:orderId,customerId:user.uid,customerName:$("coName").value.trim(),email:$("coEmail").value.trim(),phone:$("coPhone").value.trim(),shippingAddress:$("coAddress").value.trim(),items:items,subtotal:subtotal,deliveryCharges:null,grandTotal:subtotal,paymentMethod:"none",paymentStatus:"not_collected",invoiceStatus:"not_generated",orderStatus:"pending_verification",createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});try{var slganIdToken=await user.getIdToken();await fetch("https://script.google.com/macros/s/AKfycby1zrs1-PSgLzdz7r2fhmFFTNgF9PHHQPb1oN8o8TRRUxxAW_-NYEy6acqlkGAVG8mpkA/exec",{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({idToken:slganIdToken,orderId:orderId,documentId:ref.id})})}catch(notifyErr){console.warn("SLGAN shop email notification could not be requested.",notifyErr)}cart={};saveCart();alert("Order request submitted. Order ID: "+orderId);go("Orders")}catch(err){alert("Could not place order: "+err.message);btn.disabled=false}}
function diseaseHtml(list){return list.length?'<div class="disease-grid">'+list.map(function(d){var title=get(d,["diseases_name","disease_name","diseaseName","name"])||"Disease";var desc=get(d,["disease_desc","disease_description","description","desc"]);var meds=get(d,["suggested_medicines","suggestedMedicines","medicines"]);var precautions=get(d,["precautions","disease_precautions","diseasePrecautions"]);return '<article class="disease-card"><div class="disease-icon">✚</div><div class="disease-content"><h3>'+esc(title)+'</h3><p>'+esc(desc||"Information not available.")+'</p>'+(meds?'<details class="accordion"><summary>Suggested medicines</summary><p>'+esc(Array.isArray(meds)?meds.join(", "):meds)+'</p></details>':"")+(precautions?'<details class="accordion"><summary>Precautions</summary><p>'+esc(Array.isArray(precautions)?precautions.join(", "):precautions)+'</p></details>':"")+'<small>For information only. Consult a qualified healthcare professional for diagnosis and treatment.</small></div></article>'}).join("")+'</div>':'<div class="empty">No diseases found. Try another search.</div>'}function diseasePage(){return '<div class="disease-hero"><span class="eyebrow">SLGAN HEALTH LIBRARY</span><h1 class="title">Diseases & Health Information</h1><p class="sub">Explore general information and available catalogue details by disease.</p></div><div class="home-search"><span>⌕</span><input id="diseaseSearch" placeholder="Search diseases" oninput="filterDisease(this.value)"></div><div class="section-head"><h2>Browse diseases</h2><span class="muted" id="diseaseCount">'+diseases.length+' conditions</span></div><div id="diseaseList">'+diseaseHtml(diseases)+'</div>}function filterDisease(q){var list=diseases.filter(function(d){return (get(d,["diseases_name","disease_name","diseaseName","name"])+" "+get(d,["disease_desc","disease_description","description"])+" "+JSON.stringify(d)).toLowerCase().indexOf(q.toLowerCase())>=0});$("diseaseList").innerHTML=diseaseHtml(list);var count=$("diseaseCount");if(count)count.textContent=list.length+" conditions"}function orderPage(){return '<h1 class="title">My Orders</h1><p class="sub">Your order requests and status.</p>'+(orders.length?'<div class="panel table-wrap"><table><thead><tr><th>Order</th><th>Date</th><th>Total</th><th>Status</th><th>Items</th></tr></thead><tbody>'+orders.map(function(o){return '<tr><td>'+esc(o.orderId||o.id)+'</td><td>'+(o.createdAt&&o.createdAt.toDate?o.createdAt.toDate().toLocaleDateString("en-IN"):"—")+'</td><td>'+money(o.grandTotal||o.subtotal)+'</td><td><span class="badge">'+esc(o.orderStatus||"pending")+'</span></td><td>'+((o.items||[]).map(function(i){return esc(i.name)+" × "+i.quantity}).join("<br>"))+'</td></tr>'}).join("")+'</tbody></table></div>':'<div class="panel empty">You have no previous orders yet.</div>')}
function profilePage(){if(!user)return '<h1 class="title">Your Account</h1><p class="sub">Sign in to place orders and view order history.</p><button onclick="$(\'signin\').classList.remove(\'hidden\')">Open sign-in form</button>';return '<h1 class="title">Your Account</h1><p class="sub">Manage your personal details.</p><form id="profileForm" class="panel"><div class="form-grid"><div><label>First name</label><input id="firstName" value="'+esc(profile.firstName||"")+'"></div><div><label>Last name</label><input id="lastName" value="'+esc(profile.lastName||"")+'"></div><div><label>Mobile number</label><input id="mobile" value="'+esc(profile.mobileNumber||"")+'"></div><div><label>Email</label><input disabled value="'+esc(user.email||"")+'"></div><div class="span2"><label>Default delivery address</label><textarea id="address">'+esc(profile.address||"")+'</textarea></div></div><div class="actions"><button>Save profile</button><button type="button" class="secondary" onclick="auth.signOut()">Sign out</button></div><p class="foot">'+(admin?"Administrator access enabled.":"")+'</p></form>'}

function adminProducts(){return '<h1 class="title">Admin · Products</h1><p class="sub">Create, edit and remove catalogue items.</p><div class="panel"><h2 id="productFormTitle">Add product</h2><form id="productForm"><input type="hidden" id="prodId"><div class="form-grid"><div><label>Name *</label><input id="prodName" required></div><div><label>Category</label><input id="prodCat"></div><div><label>Price *</label><input id="prodPrice" type="number" min="0" required></div><div><label>Weight / quantity</label><input id="prodWeight"></div><div><label>Units</label><input id="prodUnits" placeholder="g, ml, tablets"></div><div><label>Image URL</label><input id="prodImage" type="url"></div><div><label>Stock</label><select id="prodStock"><option value="1">In stock</option><option value="0">Out of stock</option></select></div><div><label>Signature product</label><select id="prodSig"><option value="0">No</option><option value="1">Yes</option></select></div><div class="span2"><label>Description</label><textarea id="prodDesc"></textarea></div><div class="span2"><label>Usage</label><textarea id="prodUsage"></textarea></div><div class="span2"><label>Ingredients</label><textarea id="prodIng"></textarea></div></div><div class="actions"><button>Save product</button><button type="button" class="secondary" onclick="resetProd()">Clear</button></div></form></div><div class="panel table-wrap"><table><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead><tbody>'+products.map(function(p){return '<tr><td>'+esc(name(p))+'</td><td>'+esc(cat(p))+'</td><td>'+money(price(p))+'</td><td>'+(inStock(p)?"In stock":"Out")+'</td><td><button class="secondary" onclick="editProd(\''+esc(p.id)+'\')">Edit</button> <button class="danger" onclick="deleteProd(\''+esc(p.id)+'\')">Delete</button></td></tr>'}).join("")+'</tbody></table></div>'}
function editProd(id){var p=products.find(function(p){return p.id===id});if(!p)return;$("prodId").value=id;$("prodName").value=name(p);$("prodCat").value=cat(p);$("prodPrice").value=price(p);$("prodWeight").value=get(p,["product_weight","product_quantity"]);$("prodUnits").value=get(p,["product_units","units"]);$("prodImage").value=image(p);$("prodStock").value=inStock(p)?"1":"0";$("prodSig").value=p.signature===1||p.signature===true?"1":"0";$("prodDesc").value=get(p,["product_description","description"]);$("prodUsage").value=get(p,["product_usage","usage"]);$("prodIng").value=get(p,["product_ingredients","ingredients"]);$("productFormTitle").textContent="Edit product";window.scrollTo(0,0)}

async function saveProd(e){e.preventDefault();var id=$("prodId").value,data={product_name:$("prodName").value.trim(),product_category:$("prodCat").value.trim(),product_price:Number($("prodPrice").value),product_weight:$("prodWeight").value.trim(),product_quantity:$("prodWeight").value.trim(),product_units:$("prodUnits").value.trim(),product_image:$("prodImage").value.trim(),product_stock:Number($("prodStock").value),signature:Number($("prodSig").value),product_description:$("prodDesc").value.trim(),product_usage:$("prodUsage").value.trim(),product_ingredients:$("prodIng").value.trim(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()};try{if(id)await db.collection("products").doc(id).update(data);else{data.createdAt=firebase.firestore.FieldValue.serverTimestamp();await db.collection("products").add(data)}await loadProducts();render()}catch(err){alert("Save failed: "+err.message)}}

function adminOrders(){return '<h1 class="title">Admin · Orders</h1><p class="sub">Review requests and update their status.</p><div class="panel table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+orders.map(function(o){return '<tr><td>'+esc(o.orderId||o.id)+'</td><td>'+esc(o.customerName||"")+'<br>'+esc(o.email||o.phone||"")+'</td><td>'+((o.items||[]).map(function(i){return esc(i.name)+" × "+i.quantity}).join("<br>"))+'</td><td>'+money(o.grandTotal||o.subtotal)+'</td><td>'+esc(o.orderStatus||"pending")+'</td><td><button onclick="setOrder(\''+esc(o.id)+'\',\'accepted\')">Accept</button> <button class="danger" onclick="setOrder(\''+esc(o.id)+'\',\'rejected\')">Reject</button></td></tr>'}).join("")+'</tbody></table></div>'}

function adminDiseases(){return '<h1 class="title">Admin · Diseases</h1><p class="sub">Manage disease catalogue information.</p><div class="panel"><form id="diseaseForm"><input type="hidden" id="dId"><label>Disease name *</label><input id="dName" required><label>Description</label><textarea id="dDesc"></textarea><label>Suggested medicines</label><textarea id="dMeds"></textarea><label>Precautions</label><textarea id="dPrec"></textarea><div class="actions"><button>Save disease</button><button type="button" class="secondary" onclick="resetDisease()">Clear</button></div></form></div><div class="panel">'+diseases.map(function(d){return '<div class="accordion"><strong>'+esc(get(d,["diseases_name","disease_name","name"]))+'</strong><div class="actions"><button class="secondary" onclick="editDisease(\''+esc(d.id)+'\')">Edit</button><button class="danger" onclick="deleteDisease(\''+esc(d.id)+'\')">Delete</button></div></div>'}).join("")+'</div>'}
function editDisease(id){var d=diseases.find(function(d){return d.id===id});if(!d)return;$("dId").value=id;$("dName").value=get(d,["diseases_name","disease_name","name"]);$("dDesc").value=get(d,["disease_desc","description"]);$("dMeds").value=get(d,["suggested_medicines"]);$("dPrec").value=get(d,["precautions","disease_precautions"])}

function render(){var m=$("main");if(page==="Home")m.innerHTML=home();else if(page==="Categories")m.innerHTML=categoryPage();else if(page==="Product"&&chosen)m.innerHTML=detail(chosen);else if(page==="Cart")m.innerHTML=cartPage();else if(page==="Diseases")m.innerHTML=diseasePage();else if(page==="Orders")m.innerHTML=orderPage();else if(page==="Profile")m.innerHTML=profilePage();else if(page==="Admin Products")m.innerHTML=admin?adminProducts():"<div class='panel empty'>Administrator access required.</div>";else if(page==="Admin Orders")m.innerHTML=admin?adminOrders():"<div class='panel empty'>Administrator access required.</div>";else if(page==="Admin Diseases")m.innerHTML=admin?adminDiseases():"<div class='panel empty'>Administrator access required.</div>";else if(page==="Admin Customers")m.innerHTML=admin?adminCustomers():"<div class='panel empty'>Administrator access required.</div>";if($("profileForm"))$("profileForm").onsubmit=saveProfile;if($("productForm"))$("productForm").onsubmit=saveProd;if($("diseaseForm"))$("diseaseForm").onsubmit=saveDisease;renderNav()}
async function loadProducts(){var s=await db.collection("products").get();products=s.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return name(a).localeCompare(name(b))})}async function loadDiseases(){var s=await db.collection("diseases").get();diseases=s.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return String(get(a,["diseases_name","name"])).localeCompare(String(get(b,["diseases_name","name"])))})}async function loadOrders(){orders=[];if(!user)return;var q=admin?await db.collection("orders").get():await db.collection("orders").where("customerId","==",user.uid).get();orders=q.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return (b.createdAt&&b.createdAt.seconds||0)-(a.createdAt&&a.createdAt.seconds||0)})}async function loadCustomers(){customers=[];if(admin){var s=await db.collection("customers").get();customers=s.docs.map(function(d){return Object.assign({id:d.id},d.data())})}}

var slganLoadFinished=false;
function showLoadError(message){$("main").innerHTML='<div class="panel"><h2>SLGAN catalogue could not load</h2><p>'+esc(message)+'</p><p>Check your internet connection. If it continues, the Firebase connection or Firestore access needs attention.</p><button onclick="location.reload()">Try again</button></div>'}
var slganLoadWatchdog=setTimeout(function(){if(!slganLoadFinished)showLoadError("Connection to Firebase is taking too long. Tap Try again, or send us this message so we can diagnose the connection.")},12000);
if(!window.firebase||!firebase.auth||!firebase.firestore){slganLoadFinished=true;clearTimeout(slganLoadWatchdog);showLoadError("Firebase scripts did not load. Check your internet connection or browser content blocking.");}
else {
  auth.onAuthStateChanged(async function(u){
    user=u;
    try {
      await Promise.race([
        (async function(){await profileLoad();await Promise.all([loadProducts(),loadDiseases(),loadOrders(),loadCustomers()]);})(),
        new Promise(function(_,reject){setTimeout(function(){reject(new Error("Firebase request timed out after 20 seconds."))},20000)})
      ]);
      slganLoadFinished=true;clearTimeout(slganLoadWatchdog);
      $("signin").classList.toggle("hidden",!!u);render();
    } catch(e) {
      slganLoadFinished=true;clearTimeout(slganLoadWatchdog);
      showLoadError(e&&e.message?e.message:String(e));
    }
  });
}
if(window.slganStartupDiagnosticReady !== true) window.slganStartupDiagnosticReady = true;
