name: Remove non-name Telugu product translations

on:
  push:
    paths:
      - "scripts/keep_product_name_telugu_only.py"
      - ".github/workflows/keep-product-name-telugu-only.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove-extra-telugu-content-fields:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Firebase Admin SDK
        run: pip install firebase-admin
      - name: Remove only non-name Telugu companion fields
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/keep_product_name_telugu_only.py
