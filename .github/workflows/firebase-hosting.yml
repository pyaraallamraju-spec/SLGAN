name: Deploy SLGAN Firebase Hosting
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "firebase.json"
      - ".github/workflows/firebase-hosting.yml"
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Deploy Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || (echo "Missing GitHub Actions secret FIREBASE_SERVICE_ACCOUNT_JSON" && exit 1)
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          firebase deploy --only hosting --project slgan-a364e --non-interactive
