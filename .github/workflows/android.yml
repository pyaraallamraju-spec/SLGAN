name: Android build
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# Serialize builds so first-time runs cannot generate competing debug keys.
concurrency:
  group: slgan-android-debug-signing
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android user directory
        run: mkdir -p "$HOME/.android"
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: slgan-debug-keystore-v1
      - name: Create stable debug signing key if missing
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -s "$KEYSTORE" ]; then
            echo "No cached debug keystore found; generating the persistent SLGAN debug key."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Restored the existing persistent SLGAN debug keystore."
          fi
          chmod 600 "$KEYSTORE"
          keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "GOOGLE_MAPS_API_KEY is not configured; building with an empty Maps key for compile verification."
          fi
          SLGAN_DEBUG_KEYSTORE="$HOME/.android/debug.keystore" gradle assembleDebug
      - name: Verify APK uses the persistent debug signing key
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          KEY_SHA1="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA1:/{print toupper($2); exit}' | tr -d ':')"
          APK_SHA1="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | awk '/certificate SHA-1 digest:/{print toupper($NF); exit}' | tr -d ':')"
          echo "Persistent keystore SHA-1: $KEY_SHA1"
          echo "APK signer SHA-1:          $APK_SHA1"
          if [ -z "$KEY_SHA1" ] || [ "$KEY_SHA1" != "$APK_SHA1" ]; then
            echo "ERROR: APK is not signed with the persistent SLGAN debug keystore."
            exit 1
          fi
          echo "Verified: APK uses the persistent SLGAN debug signing key."
      - name: Rename APK to SLGAN.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk SLGAN.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SLGAN-APK
          path: SLGAN.apk
          if-no-files-found: error
          retention-days: 30
