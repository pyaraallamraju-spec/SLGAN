name: Android build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Serialize builds so two first-time runs cannot generate competing debug keys.
concurrency:
  group: slgan-android-debug-signing
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: slgan-debug-keystore-v1
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "GOOGLE_MAPS_API_KEY is not configured; building with an empty Maps key for compile verification."
          fi
          gradle assembleDebug
      - name: Print APK signing fingerprints
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK to SLGAN.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk SLGAN.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SLGAN-APK
          path: SLGAN.apk
          if-no-files-found: error
          retention-days: 14
