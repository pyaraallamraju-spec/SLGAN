name: Import catalogue data to Firebase

on:
  workflow_dispatch:
    inputs:
      confirm_live_import:
        description: "Type YES only when you intentionally approve a live Firestore import"
        required: true
        type: choice
        options:
          - "NO"
          - "YES"
        default: "NO"

jobs:
  import-products:
    # Live imports are blocked on develop and require an explicit manual confirmation on main.
    if: github.ref == 'refs/heads/main' && inputs.confirm_live_import == 'YES'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Firebase Admin SDK
        run: pip install firebase-admin
      - name: Import products
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/import_products.py
      - name: Import diseases
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/import_diseases.py
      - name: Add is_admin flag to existing customers
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/add_customer_admin_flag.py
      - name: Promote allowlisted initial admin account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/promote_initial_admin.py
