name: Import catalogue data to Firebase

on:
  workflow_dispatch:
  push:
    paths:
      - "data/products_seed.json"
      - "scripts/import_products.py"
      - "data/diseases_seed.json"
      - "scripts/import_diseases.py"

jobs:
  import-products:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Firebase Admin SDK
        run: pip install firebase-admin
      - name: Import products
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/import_products.py
      - name: Import diseases
        if: contains(join(github.event.commits.*.modified, ','), 'data/diseases_seed.json') || contains(join(github.event.commits.*.added, ','), 'data/diseases_seed.json') || contains(join(github.event.commits.*.modified, ','), 'scripts/import_diseases.py') || contains(join(github.event.commits.*.added, ','), 'scripts/import_diseases.py') || github.event_name == 'workflow_dispatch'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/import_diseases.py
