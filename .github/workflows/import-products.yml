name: Import catalogue data to Firebase

on:
  workflow_dispatch:
  push:
    paths:
      - "data/products_seed.json"
      - "scripts/import_products.py"
      - "data/diseases_seed.json"
      - "scripts/import_diseases.py"
      - "scripts/add_customer_admin_flag.py"
      - "scripts/promote_initial_admin.py"
      - ".github/workflows/import-products.yml"

jobs:
  import-products:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Firebase Admin SDK
        run: pip install firebase-admin
      - name: Import products
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/import_products.py
      - name: Import diseases
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/import_diseases.py
      - name: Add is_admin flag to existing customers
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/add_customer_admin_flag.py
      - name: Promote allowlisted initial admin account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/promote_initial_admin.py
