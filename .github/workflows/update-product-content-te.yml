name: Update Telugu product descriptions and indications

on:
  push:
    paths:
      - "data/product_content_te.json"
      - "scripts/update_product_content_te.py"
      - ".github/workflows/update-product-content-te.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-telugu-product-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Firebase Admin SDK
        run: pip install firebase-admin
      - name: Update only Telugu description and indication fields
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/update_product_content_te.py
