name: Update Telugu product names only

on:
  workflow_dispatch:
    inputs:
      confirm_live_update:
        description: "Type YES to update product_name_te in live Firestore"
        required: true
        type: choice
        options:
          - "NO"
          - "YES"
        default: "NO"

permissions:
  contents: read

jobs:
  update-telugu-product-names:
    if: github.ref == 'refs/heads/main' && inputs.confirm_live_update == 'YES'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Firebase Admin SDK
        run: pip install firebase-admin
      - name: Update only product_name_te in the live products collection
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/update_product_names_te.py
