name: Apps Script validation
on:
  push:
    branches: [main, develop]
    paths:
      - "backend/apps-script/**"
      - ".github/workflows/apps-script-check.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/apps-script/**"
      - ".github/workflows/apps-script-check.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Apps Script JavaScript syntax
        run: |
          set -e
          for file in backend/apps-script/*.gs; do
            echo "Checking $file"
            node --check < "$file"
          done
          echo "All Apps Script files passed JavaScript syntax validation."
