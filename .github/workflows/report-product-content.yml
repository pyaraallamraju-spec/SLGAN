name: Report live product text for Telugu localisation

on:
  push:
    paths:
      - "scripts/report_product_content_for_translation.py"
      - ".github/workflows/report-product-content.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-live-product-text:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Firebase Admin SDK
        run: pip install firebase-admin
      - name: Read product text fields (no writes)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/report_product_content_for_translation.py
