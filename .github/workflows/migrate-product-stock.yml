name: Migrate product stock field

on:
  workflow_dispatch:
    inputs:
      confirm_live_migration:
        description: "Type YES to modify the live Firestore products collection"
        required: true
        type: choice
        options:
          - "NO"
          - "YES"
        default: "NO"

permissions:
  contents: read

jobs:
  migrate-product-stock:
    if: github.ref == 'refs/heads/main' && inputs.confirm_live_migration == 'YES'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Firebase Admin SDK
        run: pip install firebase-admin
      - name: Add product_stock to existing products
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/migrate_product_stock.py
