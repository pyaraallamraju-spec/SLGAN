services:
  - type: web
    name: slgan-support-backend
    runtime: node
    rootDir: support-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DAILY_AI_LIMIT
        value: "0"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
