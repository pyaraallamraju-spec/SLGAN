services:
  - type: web
    name: slgan-support-backend
    runtime: node
    rootDir: support-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
